<header class="bg-white/90 backdrop-blur border-b border-slate-200/70 shadow-sm">
  <div class="container-page">
    <div class="h-16 flex items-center justify-between">
      <a class="flex items-center gap-2" routerLink="/" (click)="close()">
        <span class="inline-flex h-11 w-11 items-center justify-center rounded-2xl bg-blue-900 text-white font-heading font-bold text-lg">
          T+
        </span>
        <div>
          <div class="font-heading font-bold text-lg text-slate-900">Transport+</div>
          <div class="text-xs text-slate-500">Réservation de trajets</div>
        </div>
      </a>

      <nav class="hidden md:flex items-center gap-2">
        <a class="btn btn-ghost" routerLink="/">Accueil</a>
        <a class="btn btn-ghost" routerLink="/recherche">Trajets disponibles</a>
        <a *ngIf="user()?.role === 'passager'" class="btn btn-ghost" routerLink="/dashboard-passager">Mes réservations</a>
        <a *ngIf="user()?.role === 'transporteur'" class="btn btn-ghost" routerLink="/transporteur/creer-trajet">Publier un trajet</a>
        <ng-container *ngIf="user(); else notConnected">
          <a class="btn btn-ghost" [routerLink]="dashboardRoute()">Tableau de bord</a>
          <button type="button" class="btn btn-outline" (click)="logout()">Déconnexion</button>
        </ng-container>
        <ng-template #notConnected>
          <a class="btn btn-primary" routerLink="/login">Connexion</a>
        </ng-template>
      </nav>

      <button
        type="button"
        class="md:hidden btn btn-ghost"
        (click)="toggle()"
        [attr.aria-expanded]="isOpen()"
        aria-label="Ouvrir le menu"
      >
        <span class="sr-only">Menu</span>
        <div class="space-y-1">
          <div class="h-0.5 w-6 bg-slate-900"></div>
          <div class="h-0.5 w-6 bg-slate-900"></div>
          <div class="h-0.5 w-6 bg-slate-900"></div>
        </div>
      </button>
    </div>

    <div class="md:hidden pb-4" [ngClass]="{ 'hidden': !isOpen() }">
      <div class="card p-3 flex flex-col gap-2">
        <a class="btn btn-ghost justify-start" routerLink="/" (click)="close()">Accueil</a>
        <a class="btn btn-ghost justify-start" routerLink="/recherche" (click)="close()">Trajets disponibles</a>
        <a *ngIf="user()?.role === 'passager'" class="btn btn-ghost justify-start" routerLink="/dashboard-passager" (click)="close()">Mes réservations</a>
        <a *ngIf="user()?.role === 'transporteur'" class="btn btn-ghost justify-start" routerLink="/transporteur/creer-trajet" (click)="close()">Publier un trajet</a>
        <ng-container *ngIf="user(); else mobileNotConnected">
          <a class="btn btn-ghost justify-start" [routerLink]="dashboardRoute()" (click)="close()">Tableau de bord</a>
          <button type="button" class="btn btn-outline justify-start" (click)="logout(); close()">Déconnexion</button>
        </ng-container>
        <ng-template #mobileNotConnected>
          <a class="btn btn-primary justify-start" routerLink="/login" (click)="close()">Connexion</a>
        </ng-template>
      </div>
    </div>
  </div>
</header>
