<section class="min-h-screen bg-blue-50 flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-lg shadow-md p-8">

      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-slate-900 flex items-center justify-center gap-2">
          <span class="text-2xl">🚌</span> Transport+
        </h1>
        <p class="text-sm text-slate-500 mt-1">Plateforme de réservation de transport</p>
      </div>

      <div class="flex items-center justify-center gap-8 border-b border-slate-200 pb-4 mb-6">
        <a class="text-sm font-semibold text-blue-600 border-b-2 border-blue-600 pb-2" routerLink="/login">Connexion</a>
        <a class="text-sm font-semibold text-slate-400 hover:text-slate-900" routerLink="/register">Créer un compte</a>
      </div>

      <form class="space-y-4" (ngSubmit)="login()" #loginForm="ngForm">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2" for="email">Adresse e-mail</label>
          <input
            id="email" name="email" type="email"
            placeholder="votre@email.com"
            [(ngModel)]="email" required
            class="w-full border border-slate-300 rounded-lg px-4 py-2 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2" for="password">Mot de passe</label>
          <input
            id="password" name="password" type="password"
            placeholder="Votre mot de passe"
            [(ngModel)]="password" required
            class="w-full border border-slate-300 rounded-lg px-4 py-2 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          />
        </div>

        <div *ngIf="error" class="rounded-lg border border-red-200 bg-red-50 px-4 py-2 text-sm text-red-700">
          {{ error }}
        </div>

        <button
          type="submit"
          [disabled]="loading"
          class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition mt-4 disabled:opacity-60"
        >
          {{ loading ? 'Connexion...' : 'SE CONNECTER' }}
        </button>
      </form>

      <p class="text-center text-sm text-slate-500 mt-4">
        Pas de compte ?
        <a class="font-semibold text-blue-600 hover:underline" routerLink="/register">S'inscrire</a>
      </p>
    </div>
  </div>
</section>
