<section class="min-h-screen bg-blue-50 flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-lg shadow-md p-8">
      <!-- Header -->
      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-slate-900 flex items-center justify-center gap-2">
          <span class="text-2xl">🚌</span>
          Transport+
        </h1>
        <p class="text-sm text-slate-500 mt-1">Plateforme de réservation de transport</p>
      </div>

      <!-- Tabs -->
      <div class="flex items-center justify-center gap-8 border-b border-slate-200 pb-4 mb-6">
        <a class="text-sm font-semibold text-blue-600 border-b-2 border-blue-600 pb-2" routerLink="/login">Connexion</a>
        <a class="text-sm font-semibold text-slate-400 hover:text-slate-900" routerLink="/register">Créer un compte</a>
      </div>

      <!-- Form -->
      <form class="space-y-4" (ngSubmit)="login()" #loginForm="ngForm">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2" for="email">
            📧 Adresse e-mail
          </label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            placeholder="Adresse e-mail"
            [(ngModel)]="email"
            required
            class="w-full border border-slate-300 rounded-lg px-4 py-2 text-sm text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2" for="password">
            🔐 Mot de passe
          </label>
          <div class="relative">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Mot de passe"
              [(ngModel)]="password"
              required
              class="w-full border border-slate-300 rounded-lg px-4 py-2 pr-10 text-sm text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
            />
            <button
              type="button"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
              aria-label="Afficher le mot de passe"
            >
              👁
            </button>
          </div>
        </div>

        <div *ngIf="error" class="rounded-lg border border-red-200 bg-red-50 px-4 py-2 text-sm text-red-700">
          {{ error }}
        </div>

        <button
          type="submit"
          class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition mt-6"
        >
          SE CONNECTER
        </button>
      </form>

      <!-- Sign Up Link -->
      <p class="text-center text-sm text-slate-500 mt-4">
        Pas de compte ?
        <a class="font-semibold text-blue-600 hover:underline" routerLink="/register">S'inscrire</a>
      </p>

      <!-- Test Credentials -->
      <div class="mt-8 pt-6 border-t border-slate-200">
        <p class="text-center text-xs uppercase tracking-widest text-slate-400 font-semibold mb-4">Identifiants de test</p>
        
        <div class="space-y-3">
          <div class="rounded-lg border-l-4 border-blue-600 bg-blue-50 p-3 text-sm">
            <p class="font-semibold text-blue-900">👤 Passager</p>
            <p class="text-blue-800">passager@transport.com</p>
            <p class="text-blue-800">Pass123!</p>
          </div>

          <div class="rounded-lg border-l-4 border-orange-600 bg-orange-50 p-3 text-sm">
            <p class="font-semibold text-orange-900">🚌 Transporteur</p>
            <p class="text-orange-800">transporteur@transport.com</p>
            <p class="text-orange-800">Trans123!</p>
          </div>

          <div class="rounded-lg border-l-4 border-red-600 bg-red-50 p-3 text-sm">
            <p class="font-semibold text-red-900">⚙️ Admin</p>
            <p class="text-red-800">admin@transport.com</p>
            <p class="text-red-800">Admin123!</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
