<section class="py-10">
  <div class="container-page">
    <div class="grid gap-6 md:grid-cols-2 items-center">
      <div>
        <h1 class="text-3xl md:text-4xl font-heading font-bold text-slate-900">Connexion</h1>
        <p class="mt-2 text-slate-600">
          Accède à ton espace pour réserver et gérer tes trajets.
        </p>
      </div>

      <div class="card p-6">
        <div class="text-sm text-slate-600">Sprint 1</div>
        <div class="mt-1 text-lg font-heading font-bold">Formulaire bientôt disponible</div>

        <div class="mt-6 grid gap-4">
          <div>
            <label class="label">Email</label>
            <input class="input" type="email" placeholder="ex: abdoul@mail.com" disabled>
          </div>

          <div>
            <label class="label">Mot de passe</label>
            <input class="input" type="password" placeholder="••••••••" disabled>
          </div>

          <button class="btn-primary w-full" type="button" disabled>Se connecter</button>

          <p class="text-sm text-slate-600">
            Pas encore de compte ?
            <a class="text-brand-navy font-semibold hover:underline" routerLink="/register">Créer un compte</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
