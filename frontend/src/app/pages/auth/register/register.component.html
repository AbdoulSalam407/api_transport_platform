<section class="py-10">
  <div class="container-page">
    <div class="grid gap-6 md:grid-cols-2 items-center">
      <div>
        <h1 class="text-3xl md:text-4xl font-heading font-bold text-slate-900">Inscription</h1>
        <p class="mt-2 text-slate-600">
          Crée ton compte Transport+ et réserve en quelques minutes.
        </p>
      </div>

      <div class="card p-6">
        <div class="text-sm text-slate-600">Sprint 1</div>
        <div class="mt-1 text-lg font-heading font-bold">Page prête pour Sprint 2</div>

        <div class="mt-6 grid gap-4">
          <div>
            <label class="label">Nom complet</label>
            <input class="input" type="text" placeholder="ex: Abdoul Salam" disabled>
          </div>

          <div>
            <label class="label">Email</label>
            <input class="input" type="email" placeholder="ex: abdoul@mail.com" disabled>
          </div>

          <div>
            <label class="label">Mot de passe</label>
            <input class="input" type="password" placeholder="••••••••" disabled>
          </div>

          <button class="btn-accent w-full" type="button" disabled>Créer un compte</button>

          <p class="text-sm text-slate-600">
            Déjà un compte ?
            <a class="text-brand-navy font-semibold hover:underline" routerLink="/login">Se connecter</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
